name: Build Kernel

on:
  push:
    branches:
      - lineage-21-rel
  pull_request:
    branches:
      - lineage-21-rel

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Checkout mã nguồn từ repository
    - name: Checkout code
      uses: actions/checkout@v3

    # Bước 2: Cài đặt môi trường build
    - name: Install dependencies
      run: |
        sudo apt update && sudo apt install -y git device-tree-compiler lz4 xz-utils zlib1g-dev openjdk-17-jdk gcc g++ python3 python-is-python3 p7zip-full android-sdk-libsparse-utils erofs-utils \ 
        default-jdk git gnupg flex bison gperf build-essential zip curl libc6-dev libncurses-dev libx11-dev libreadline-dev libgl1 libgl1-mesa-dev \ 
        python3 make sudo gcc g++ bc grep tofrodos python3-markdown libxml2-utils xsltproc zlib1g-dev python-is-python3 libc6-dev libtinfo6 \ 
        make repo cpio kmod openssl libelf-dev pahole libssl-dev libarchive-tools zstd --fix-missing && wget http://ports.ubuntu.com/pool/universe/n/ncurses/libtinfo5_6.3-2_arm64.deb && sudo dpkg -i libtinfo5_6.3-2_arm64.deb

    # Bước 4: Cấu hình kernel
    - name: Configure Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=$(pwd)/gcc-arm-10.2-2020.11-x86_64-arm-none-eabi/bin/aarch64-none-elf-
        make .config

    # Bước 5: Build kernel
    - name: Build Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=$(pwd)/gcc-arm-10.2-2020.11-x86_64-arm-none-eabi/bin/aarch64-none-elf-
        make -j$(nproc)

    # Bước 6: Upload artifacts
    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: arch/arm64/boot/
