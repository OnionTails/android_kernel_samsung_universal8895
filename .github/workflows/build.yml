name: Build Kernel

on:
  push:
    branches:
      - lineage-21-rel
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y git device-tree-compiler lz4 xz-utils zlib1g-dev openjdk-17-jdk gcc g++ python3 python-is-python3 p7zip-full android-sdk-libsparse-utils erofs-utils \
        default-jdk gnupg flex bison gperf build-essential zip curl libc6-dev libncurses-dev libx11-dev libreadline-dev libgl1 libgl1-mesa-dev \
        bc grep tofrodos python3-markdown libxml2-utils xsltproc libc6-dev libtinfo6 repo cpio kmod openssl libelf-dev pahole libssl-dev libarchive-tools zstd wget ca-certificates --fix-missing

        # Cài libtinfo5 nếu kernel cần
        wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb
        sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb

    - name: Download Clang Toolchain (Android 14 clang-r487747c)
      run: |
        mkdir -p toolchain/clang
        cd toolchain/clang
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz
        tar -xzf clang-r487747c.tar.gz

    - name: Build Kernel with Clang
      run: |
        export CLANG_PATH=$PWD/toolchain/clang
        export PATH=$CLANG_PATH/bin:$PATH

        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        export CLANG_TRIPLE=aarch64-linux-android-
        export AS=llvm-as  # Tránh lỗi -EL như bạn từng gặp

        make LLVM=1 AS=llvm-as CC=clang LD=ld.lld

    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: |
          arch/arm64/boot/Image*
          arch/arm64/boot/dts/*
